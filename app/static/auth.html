<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Study Assistant - Login</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --text-main: #2b2b2b;
            --text-muted: #6b6b6b;
            --border-color: #d1d1d1;
            --button-bg: #4a4a4a;
            --button-hover: #2b2b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .auth-box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.95em;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85em;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            background: #fafafa;
        }

        input:focus {
            border-color: var(--button-bg);
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--button-bg);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--button-hover); }

        .error-msg {
            color: #c0392b;
            font-size: 0.85em;
            margin-top: 12px;
            display: none;
        }

        .success-msg {
            color: #27ae60;
            font-size: 0.85em;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h1>📚 Study Assistant</h1>
    <p class="subtitle">Your personal RAG-powered study companion</p>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="handleLogin()">Login</button>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none;">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Min. 6 characters" />
        </div>
        <button class="btn" onclick="handleSignup()">Create Account</button>
        <div class="error-msg" id="signupError"></div>
        <div class="success-msg" id="signupSuccess"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://wfdecrzgzeirrhiiyosx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmZGVjcnpnemVpcnJoaWl5b3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDA1NjgsImV4cCI6MjA5MjE3NjU2OH0.A1qoy6NPz9JbAX0QfFLGoVssLHS6SM-FydLEFzOKVHY"; // eyJ... key

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = "/static/index.html";
    });

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');

        const { error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
            errEl.textContent = error.message;
            errEl.style.display = 'block';
        } else {
            window.location.href = "/static/index.html";
        }
    }

    async function handleSignup() {
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const errEl = document.getElementById('signupError');
        const successEl = document.getElementById('signupSuccess');

        const { error } = await sb.auth.signUp({ email, password });

        if (error) {
            errEl.textContent = error.message;
            errEl.style.display = 'block';
        } else {
            successEl.textContent = "Account created! Please check your email to confirm, then login.";
            successEl.style.display = 'block';
        }
    }
</script>

</body>
</html>
