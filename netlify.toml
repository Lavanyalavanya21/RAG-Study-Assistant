[build]
  publish = "app/static"    # folder containing your index.html + auth.html

# Proxy /api/* → your Render backend so the frontend never exposes the backend URL
[[redirects]]
  from   = "/api/*"
  to     = "https://study-assistant-api.onrender.com/:splat"
  status = 200
  force  = true

# SPA fallback — route all unknown paths to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"