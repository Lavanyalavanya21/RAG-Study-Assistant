[build]
  publish = "app/static"

[[redirects]]
  from   = "/api/*"
  to     = "https://rag-study-assistant-qy7n.onrender.com/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth.html"
  to     = "/auth.html"
  status = 200

[[redirects]]
  from   = "/index.html"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200