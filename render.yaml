services:
  - type: web
    name: study-assistant-api
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false           # set manually in Render dashboard

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: LLM_MODEL
        value: llama-3.3-70b-versatile

      - key: PYTHON_VERSION
        value: "3.11"

    # Persist the FAISS vectorstore across deploys using a Render disk
    disk:
      name: vectorstore
      mountPath: /opt/render/project/src/vectorstore
      sizeGB: 1